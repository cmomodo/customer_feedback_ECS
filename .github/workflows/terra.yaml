name: Terraform Deploy workflow

on:
  workflow_run:
    workflows:
      - "Docker build and push"
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - "infra/**"
  workflow_dispatch:

jobs:
  terraform:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    concurrency:
      group: terraform-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: write
    defaults:
      run:
        working-directory: ./infra
    env:
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}
      TF_VAR_base_url: ${{ secrets.BASE_URL }}
      TF_VAR_vpc_cidr: ${{ secrets.VPC_CIDR }}
      TF_VAR_public_subnet_1_cidr: ${{ secrets.PUBLIC_SUBNET_1_CIDR }}
      TF_VAR_public_subnet_2_cidr: ${{ secrets.PUBLIC_SUBNET_2_CIDR }}
      TF_VAR_private_subnet_1_cidr: ${{ secrets.PRIVATE_SUBNET_1_CIDR }}
      TF_VAR_private_subnet_2_cidr: ${{ secrets.PRIVATE_SUBNET_2_CIDR }}
      TF_VAR_container_port: ${{ secrets.CONTAINER_PORT }}
      TF_VAR_github_repo: ${{ secrets.REPO_NAME }}
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_db_name: ${{ secrets.DB_NAME }}
      TF_VAR_db_identifier: ${{ secrets.DB_IDENTIFIER }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
      TF_VAR_identifier_username: ${{ secrets.IDENTIFIER_USERNAME }}
      TF_VAR_identifier_password: ${{ secrets.IDENTIFIER_PASSWORD }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      BOOTSTRAP_TF_STATE_BUCKET: ${{ secrets.BOOTSTRAP_TF_STATE_BUCKET != '' && secrets.BOOTSTRAP_TF_STATE_BUCKET || vars.BOOTSTRAP_TF_STATE_BUCKET }}
      BOOTSTRAP_TF_STATE_KEY: ${{ secrets.BOOTSTRAP_TF_STATE_KEY != '' && secrets.BOOTSTRAP_TF_STATE_KEY || vars.BOOTSTRAP_TF_STATE_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Validate bootstrap backend config inputs
        run: |
          test -n "$BOOTSTRAP_TF_STATE_BUCKET"
          test -n "$BOOTSTRAP_TF_STATE_KEY"
        working-directory: .

      - name: Initialize Bootstrap Terraform (read outputs)
        run: |
          terraform -chdir=bootstrap init -reconfigure \
            -backend-config="bucket=${BOOTSTRAP_TF_STATE_BUCKET}" \
            -backend-config="key=${BOOTSTRAP_TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
        working-directory: .

      - name: Read bootstrap outputs
        id: bootstrap
        run: |
          ecr_name="$(terraform -chdir=bootstrap output -raw ecr_repository_name)"
          ecr_url="$(terraform -chdir=bootstrap output -raw ecr_repository_url)"
          state_bucket="$(terraform -chdir=bootstrap output -raw state_bucket_name)"
          echo "ecr_repository_name=$ecr_name" >> "$GITHUB_OUTPUT"
          echo "ecr_repository_url=$ecr_url" >> "$GITHUB_OUTPUT"
          echo "state_bucket_name=$state_bucket" >> "$GITHUB_OUTPUT"
        working-directory: .

      - name: Export Terraform vars from bootstrap
        run: |
          echo "TF_VAR_ecr_repository_name=${{ steps.bootstrap.outputs.ecr_repository_name }}" >> "$GITHUB_ENV"
        working-directory: .

      - name: Download build metadata artifact
        if: ${{ github.event_name == 'workflow_run' }}
        id: download-build-meta
        uses: actions/download-artifact@v4
        with:
          name: build-metadata
          path: .artifacts/build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
        continue-on-error: true

      - name: Resolve image tag
        id: image-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ -f .artifacts/build/image_tag.txt ]; then
            IMAGE_TAG="$(cat .artifacts/build/image_tag.txt)"
          else
            IMAGE_TAG="latest"
          fi
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "TF_VAR_image_tag=$IMAGE_TAG" >> "$GITHUB_ENV"
        working-directory: .

      - name: Initialize Terraform
        run: terraform init

      - name: Validate Terraform
        run: terraform validate

      - name: Plan Terraform
        run: terraform plan -lock-timeout=5m -out=tfplan

      - name: Apply Terraform
        run: terraform apply -auto-approve -lock-timeout=5m tfplan
