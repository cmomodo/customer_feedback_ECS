name: Docker build and push

on:
  workflow_run:
    workflows:
      - "Terraform Bootstrap workflow"
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - "app/fider-main/**"
      - ".github/workflows/build.yaml"
  workflow_dispatch:

jobs:
  docker:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: write
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      BOOTSTRAP_TF_STATE_BUCKET: ${{ secrets.BOOTSTRAP_TF_STATE_BUCKET != '' && secrets.BOOTSTRAP_TF_STATE_BUCKET || vars.BOOTSTRAP_TF_STATE_BUCKET }}
      BOOTSTRAP_TF_STATE_KEY: ${{ secrets.BOOTSTRAP_TF_STATE_KEY != '' && secrets.BOOTSTRAP_TF_STATE_KEY || vars.BOOTSTRAP_TF_STATE_KEY }}
      BOOTSTRAP_TF_STATE_REGION: ${{ secrets.BOOTSTRAP_TF_STATE_REGION != '' && secrets.BOOTSTRAP_TF_STATE_REGION || vars.BOOTSTRAP_TF_STATE_REGION }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform (read bootstrap outputs)
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Validate bootstrap backend config inputs
        run: |
          test -n "$BOOTSTRAP_TF_STATE_BUCKET"
          test -n "$BOOTSTRAP_TF_STATE_KEY"
          test -n "$BOOTSTRAP_TF_STATE_REGION"

      - name: Initialize Bootstrap Terraform (read outputs)
        run: |
          terraform -chdir=bootstrap init -reconfigure \
            -backend-config="bucket=${BOOTSTRAP_TF_STATE_BUCKET}" \
            -backend-config="key=${BOOTSTRAP_TF_STATE_KEY}" \
            -backend-config="region=${BOOTSTRAP_TF_STATE_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Read bootstrap ECR outputs
        id: bootstrap
        run: |
          echo "ecr_repository_name=$(terraform -chdir=bootstrap output -raw ecr_repository_name)" >> "$GITHUB_OUTPUT"
          echo "ecr_repository_url=$(terraform -chdir=bootstrap output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: tag
        run: echo "image_tag=${{ github.run_number }}-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ steps.bootstrap.outputs.ecr_repository_name }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG ./app/fider-main
          docker tag $REGISTRY/$REPOSITORY:$IMAGE_TAG $REGISTRY/$REPOSITORY:latest

      - name: Trivy scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ steps.bootstrap.outputs.ecr_repository_name }}:${{ steps.tag.outputs.image_tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"

      - name: Push docker image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ steps.bootstrap.outputs.ecr_repository_name }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:latest

      - name: Persist build metadata for terraform deploy
        run: |
          mkdir -p .artifacts/build
          echo "${{ steps.tag.outputs.image_tag }}" > .artifacts/build/image_tag.txt

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: build-metadata
          path: .artifacts/build/image_tag.txt
          if-no-files-found: error
