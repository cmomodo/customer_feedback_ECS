name: Terraform Bootstrap workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "bootstrap/**"
      - ".github/workflows/bootstrap.yaml"

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      BOOTSTRAP_TF_STATE_BUCKET: ${{ secrets.BOOTSTRAP_TF_STATE_BUCKET != '' && secrets.BOOTSTRAP_TF_STATE_BUCKET || vars.BOOTSTRAP_TF_STATE_BUCKET }}
      BOOTSTRAP_TF_STATE_KEY: ${{ secrets.BOOTSTRAP_TF_STATE_KEY != '' && secrets.BOOTSTRAP_TF_STATE_KEY || vars.BOOTSTRAP_TF_STATE_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Validate bootstrap backend config inputs
        run: |
          test -n "$BOOTSTRAP_TF_STATE_BUCKET"
          test -n "$BOOTSTRAP_TF_STATE_KEY"

      - name: Initialize Bootstrap Terraform
        run: |
          terraform -chdir=bootstrap init -reconfigure \
            -backend-config="bucket=${BOOTSTRAP_TF_STATE_BUCKET}" \
            -backend-config="key=${BOOTSTRAP_TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \

      - name: Validate Bootstrap Terraform
        run: terraform -chdir=bootstrap validate

      - name: Plan Bootstrap Terraform
        run: terraform -chdir=bootstrap plan -lock-timeout=5m -out=tfplan

      - name: Apply Bootstrap Terraform
        run: terraform -chdir=bootstrap apply -auto-approve -lock-timeout=5m tfplan

      - name: Show bootstrap outputs
        run: |
          terraform -chdir=bootstrap output ecr_repository_name
          terraform -chdir=bootstrap output state_bucket_name
