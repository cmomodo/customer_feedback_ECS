name: Docker build and push

on:
  workflow_run:
    workflows:
      - "Terraform Deploy workflow"
    types:
      - completed
  workflow_dispatch:

jobs:
  docker:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest-arm64
    concurrency:
      group: docker-deploy-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
    env:
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}
      TF_VAR_base_url: ${{ secrets.BASE_URL }}
      TF_VAR_vpc_cidr: ${{ secrets.VPC_CIDR }}
      TF_VAR_private_subnet_cidrs: >-
        {"private-1a":"${{ secrets.PRIVATE_SUBNET_1_CIDR }}","private-1b":"${{ secrets.PRIVATE_SUBNET_2_CIDR }}"}
      TF_VAR_container_port: ${{ secrets.CONTAINER_PORT }}
      TF_VAR_github_repo: ${{ secrets.REPO_NAME }}
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_db_name: ${{ secrets.DB_NAME }}
      TF_VAR_db_identifier: ${{ secrets.DB_IDENTIFIER }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
      TF_VAR_identifier_username: ${{ secrets.IDENTIFIER_USERNAME }}
      TF_VAR_identifier_password: ${{ secrets.IDENTIFIER_PASSWORD }}
      TF_VAR_create_ecr_repository: "false"
      AWS_REGION: ${{ secrets.AWS_REGION }}
      BOOTSTRAP_TF_STATE_BUCKET: ${{ secrets.BOOTSTRAP_TF_STATE_BUCKET != '' && secrets.BOOTSTRAP_TF_STATE_BUCKET || vars.BOOTSTRAP_TF_STATE_BUCKET }}
      BOOTSTRAP_TF_STATE_KEY: ${{ secrets.BOOTSTRAP_TF_STATE_KEY != '' && secrets.BOOTSTRAP_TF_STATE_KEY || vars.BOOTSTRAP_TF_STATE_KEY }}
      BOOTSTRAP_TF_STATE_REGION: ${{ secrets.BOOTSTRAP_TF_STATE_REGION != '' && secrets.BOOTSTRAP_TF_STATE_REGION || vars.BOOTSTRAP_TF_STATE_REGION }}
      TF_PLUGIN_CACHE_DIR: /home/runner/.terraform.d/plugin-cache
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read bootstrap ECR outputs from state
        id: ecr
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BOOTSTRAP_TF_STATE_BUCKET"
          test -n "$BOOTSTRAP_TF_STATE_KEY"
          test -n "$BOOTSTRAP_TF_STATE_REGION"

          aws s3 cp "s3://${BOOTSTRAP_TF_STATE_BUCKET}/${BOOTSTRAP_TF_STATE_KEY}" /tmp/bootstrap.tfstate
          ecr_repository_name="$(jq -r '.outputs.ecr_repository_name.value // empty' /tmp/bootstrap.tfstate)"
          ecr_repository_url="$(jq -r '.outputs.ecr_repository_url.value // empty' /tmp/bootstrap.tfstate)"
          test -n "$ecr_repository_name"
          test -n "$ecr_repository_url"

          echo "ecr_repository_name=${ecr_repository_name}" >> "$GITHUB_OUTPUT"
          echo "ecr_repository_url=${ecr_repository_url}" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag and Terraform vars
        id: image
        run: |
          image_tag="${GITHUB_SHA}"
          image_uri="${{ steps.ecr.outputs.ecr_repository_url }}:${image_tag}"

          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${image_uri}" >> "$GITHUB_OUTPUT"
          echo "TF_VAR_ecr_repository_name=${{ steps.ecr.outputs.ecr_repository_name }}" >> "$GITHUB_ENV"
          echo "TF_VAR_image_tag=${image_tag}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ARM64 Docker image
        env:
          ECR_REPOSITORY_URL: ${{ steps.ecr.outputs.ecr_repository_url }}
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --push \
            -t "${ECR_REPOSITORY_URL}:${IMAGE_TAG}" \
            -t "${ECR_REPOSITORY_URL}:latest" \
            ./app/fider-main

      - name: Trivy scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image_uri }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-${{ runner.os }}-${{ hashFiles('infra/.terraform.lock.hcl') }}
          restore-keys: terraform-${{ runner.os }}-

      - name: Initialize Terraform
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform -chdir=infra init
          terraform -chdir=infra apply -auto-approve

      - name: Update ECS service
        env:
          ECS_CLUSTER: customer_feedback
          ECS_SERVICE: runner_one
        run: |
          aws ecs update-service \
             --cluster $ECS_CLUSTER \
             --service $ECS_SERVICE \
             --force-new-deployment \
             --region ${{ env.AWS_REGION }}
