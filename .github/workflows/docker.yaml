name: Docker build and push

on:
  workflow_run:
    workflows:
      - "Terraform Deploy workflow"
    types:
      - completed
  workflow_dispatch:

jobs:
  docker:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: docker-deploy-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
    env:
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}
      TF_VAR_base_url: ${{ secrets.BASE_URL }}
      TF_VAR_vpc_cidr: ${{ secrets.VPC_CIDR }}
      TF_VAR_private_subnet_cidrs: >-
        {"private-1a":"${{ secrets.PRIVATE_SUBNET_1_CIDR }}","private-1b":"${{ secrets.PRIVATE_SUBNET_2_CIDR }}"}
      TF_VAR_container_port: ${{ secrets.CONTAINER_PORT }}
      TF_VAR_github_repo: ${{ secrets.REPO_NAME }}
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_db_name: ${{ secrets.DB_NAME }}
      TF_VAR_db_identifier: ${{ secrets.DB_IDENTIFIER }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
      TF_VAR_identifier_username: ${{ secrets.IDENTIFIER_USERNAME }}
      TF_VAR_identifier_password: ${{ secrets.IDENTIFIER_PASSWORD }}
      TF_VAR_create_ecr_repository: "false"
      AWS_REGION: ${{ secrets.AWS_REGION }}
      BOOTSTRAP_TF_STATE_BUCKET: ${{ secrets.BOOTSTRAP_TF_STATE_BUCKET != '' && secrets.BOOTSTRAP_TF_STATE_BUCKET || vars.BOOTSTRAP_TF_STATE_BUCKET }}
      BOOTSTRAP_TF_STATE_KEY: ${{ secrets.BOOTSTRAP_TF_STATE_KEY != '' && secrets.BOOTSTRAP_TF_STATE_KEY || vars.BOOTSTRAP_TF_STATE_KEY }}
      BOOTSTRAP_TF_STATE_REGION: ${{ secrets.BOOTSTRAP_TF_STATE_REGION != '' && secrets.BOOTSTRAP_TF_STATE_REGION || vars.BOOTSTRAP_TF_STATE_REGION }}
      IMAGE_PLATFORM: linux/arm64
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform (read bootstrap outputs)
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Validate bootstrap backend config inputs
        run: |
          test -n "$BOOTSTRAP_TF_STATE_BUCKET"
          test -n "$BOOTSTRAP_TF_STATE_KEY"
          test -n "$BOOTSTRAP_TF_STATE_REGION"

      - name: Initialize Bootstrap Terraform (read outputs)
        run: |
          terraform -chdir=bootstrap init -reconfigure \
            -backend-config="bucket=${BOOTSTRAP_TF_STATE_BUCKET}" \
            -backend-config="key=${BOOTSTRAP_TF_STATE_KEY}" \
            -backend-config="region=${BOOTSTRAP_TF_STATE_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Read bootstrap ECR outputs
        id: bootstrap
        run: |
          echo "ecr_repository_name=$(terraform -chdir=bootstrap output -raw ecr_repository_name)" >> "$GITHUB_OUTPUT"
          echo "ecr_repository_url=$(terraform -chdir=bootstrap output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: tag
        run: echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 docker image for Trivy scan
        uses: docker/build-push-action@v5
        with:
          context: ./app/fider-main
          platforms: ${{ env.IMAGE_PLATFORM }}
          push: false
          outputs: type=docker,dest=/tmp/fider-image.tar
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ steps.bootstrap.outputs.ecr_repository_name }}:${{ steps.tag.outputs.image_tag }}

      - name: Trivy scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: /tmp/fider-image.tar
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"

      - name: Build and push ARM64 docker image to Amazon ECR
        uses: docker/build-push-action@v5
        with:
          context: ./app/fider-main
          platforms: ${{ env.IMAGE_PLATFORM }}
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ steps.bootstrap.outputs.ecr_repository_name }}:${{ steps.tag.outputs.image_tag }}

      - name: Export image tag for ECS deployment
        run: |
          echo "TF_VAR_ecr_repository_name=${{ steps.bootstrap.outputs.ecr_repository_name }}" >> "$GITHUB_ENV"
          echo "TF_VAR_image_tag=${{ steps.tag.outputs.image_tag }}" >> "$GITHUB_ENV"

      - name: Initialize Terraform
        run: terraform -chdir=infra init

      - name: Validate Terraform
        run: terraform -chdir=infra validate

      - name: Plan ECS deployment
        run: terraform -chdir=infra plan -lock-timeout=5m -out=tfplan

      - name: Apply ECS deployment
        run: terraform -chdir=infra apply -auto-approve -lock-timeout=5m tfplan
