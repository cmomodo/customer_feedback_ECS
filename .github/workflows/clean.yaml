name: Terraform Clean workflow

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Type DESTROY to confirm cleanup (infra + bootstrap ECR, keeps state bucket)"
        required: true
        type: string

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ./infra
    env:
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}
      TF_VAR_base_url: ${{ secrets.BASE_URL }}
      TF_VAR_vpc_cidr: ${{ secrets.VPC_CIDR }}
      TF_VAR_public_subnet_1_cidr: ${{ secrets.PUBLIC_SUBNET_1_CIDR }}
      TF_VAR_public_subnet_2_cidr: ${{ secrets.PUBLIC_SUBNET_2_CIDR }}
      TF_VAR_private_subnet_1_cidr: ${{ secrets.PRIVATE_SUBNET_1_CIDR }}
      TF_VAR_private_subnet_2_cidr: ${{ secrets.PRIVATE_SUBNET_2_CIDR }}
      TF_VAR_container_port: ${{ secrets.CONTAINER_PORT }}
      TF_VAR_github_repo: ${{ secrets.REPO_NAME }}
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_db_name: ${{ secrets.DB_NAME }}
      TF_VAR_db_identifier: ${{ secrets.DB_IDENTIFIER }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
      TF_VAR_identifier_username: ${{ secrets.IDENTIFIER_USERNAME }}
      TF_VAR_identifier_password: ${{ secrets.IDENTIFIER_PASSWORD }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      BOOTSTRAP_TF_STATE_BUCKET: ${{ secrets.BOOTSTRAP_TF_STATE_BUCKET != '' && secrets.BOOTSTRAP_TF_STATE_BUCKET || vars.BOOTSTRAP_TF_STATE_BUCKET }}
      BOOTSTRAP_TF_STATE_KEY: ${{ secrets.BOOTSTRAP_TF_STATE_KEY != '' && secrets.BOOTSTRAP_TF_STATE_KEY || vars.BOOTSTRAP_TF_STATE_KEY }}
      BOOTSTRAP_TF_STATE_REGION: ${{ secrets.BOOTSTRAP_TF_STATE_REGION != '' && secrets.BOOTSTRAP_TF_STATE_REGION || vars.BOOTSTRAP_TF_STATE_REGION }}
      RDS_SNAPSHOT_IDENTIFIER: fider-db-snapshot
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "0"

    steps:
      - name: Validate confirmation input
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirm_destroy }}" != "DESTROY" ]; then
            echo "Invalid confirmation. Type DESTROY to run cleanup."
            exit 1
          fi
        working-directory: .

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Validate bootstrap backend config inputs
        run: |
          set -euo pipefail
          test -n "$BOOTSTRAP_TF_STATE_BUCKET"
          test -n "$BOOTSTRAP_TF_STATE_KEY"
          test -n "$BOOTSTRAP_TF_STATE_REGION"
        working-directory: .

      - name: Init bootstrap terraform
        run: |
          set -euo pipefail
          terraform -chdir=bootstrap init -reconfigure \
            -input=false \
            -backend-config="bucket=${BOOTSTRAP_TF_STATE_BUCKET}" \
            -backend-config="key=${BOOTSTRAP_TF_STATE_KEY}" \
            -backend-config="region=${BOOTSTRAP_TF_STATE_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
        working-directory: .

      - name: Read bootstrap outputs
        id: bootstrap
        run: |
          set -euo pipefail
          echo "ecr_repository_name=$(terraform -chdir=bootstrap output -raw ecr_repository_name)" >> "$GITHUB_OUTPUT"
          echo "state_bucket_name=$(terraform -chdir=bootstrap output -raw state_bucket_name)" >> "$GITHUB_OUTPUT"
        working-directory: .

      - name: Export terraform vars from bootstrap
        run: echo "TF_VAR_ecr_repository_name=${{ steps.bootstrap.outputs.ecr_repository_name }}" >> "$GITHUB_ENV"
        working-directory: .

      - name: Terraform init (infra)
        run: terraform init -input=false

      - name: Terraform destroy (infra)
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          terraform destroy -input=false -auto-approve -lock-timeout=5m

      - name: Delete RDS snapshot if present
        run: |
          set -euo pipefail
          SNAPSHOT_ID="${RDS_SNAPSHOT_IDENTIFIER}"
          if aws rds describe-db-snapshots --db-snapshot-identifier "$SNAPSHOT_ID" >/dev/null 2>&1; then
            STATUS="$(aws rds describe-db-snapshots --db-snapshot-identifier "$SNAPSHOT_ID" --query 'DBSnapshots[0].Status' --output text)"
            if [ "$STATUS" = "creating" ]; then
              aws rds wait db-snapshot-completed --db-snapshot-identifier "$SNAPSHOT_ID"
            fi
            aws rds delete-db-snapshot --db-snapshot-identifier "$SNAPSHOT_ID"
            aws rds wait db-snapshot-deleted --db-snapshot-identifier "$SNAPSHOT_ID"
            echo "Deleted snapshot: $SNAPSHOT_ID"
          else
            echo "Snapshot not found (nothing to delete): $SNAPSHOT_ID"
          fi

      - name: Terraform destroy (bootstrap ECR only)
        run: |
          set -euo pipefail
          terraform -chdir=bootstrap destroy \
            -target=aws_ecr_repository.customer_feedback \
            -input=false \
            -auto-approve \
            -lock-timeout=5m
        working-directory: .

      - name: Cleanup summary
        run: |
          echo "Destroyed infra stack and bootstrap ECR repository."
          echo "Preserved Terraform state bucket: ${{ steps.bootstrap.outputs.state_bucket_name }}"
          echo "Destroyed bootstrap ECR repo: ${{ steps.bootstrap.outputs.ecr_repository_name }}"
        working-directory: .
